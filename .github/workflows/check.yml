name: Verify AFTERIMAGE changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate imports and public datasets
        run: python3 -m unittest discover -s tests -v
      - name: Validate client code and UI contract
        run: |
          node --check assets/app.js
          node --test tests/frontend.test.cjs
