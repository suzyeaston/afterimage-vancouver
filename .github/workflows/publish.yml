name: Publish AFTERIMAGE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: afterimage-pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source data and interface
        run: |
          python3 -m unittest discover -s tests -v
          node --check assets/app.js
          node --test tests/frontend.test.cjs
          node --check assets/atlas-core.js
          node --check assets/atlas.js
          node --check assets/city-map.js
          node --test tests/atlas.test.cjs
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/index.html
          cp assets/* _site/assets/
          cp data/catalog.json data/history.json data/community.json data/organizations.json data/compass.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4