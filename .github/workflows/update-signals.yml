name: Update public hiring signals
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project and database
        run: python3 -m unittest discover -s tests -v
      - name: Refresh only official public ATS feeds and expire old manual observations
        run: python3 scripts/build_catalog.py --refresh --append-history
      - name: Commit public aggregate data if changed
        run: |
          git config user.name 'afterimage-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public Vancouver hiring signals'
            git push
          fi
